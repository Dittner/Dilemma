[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "Dilemma"
version = "0.3.1"
description = "A dictionary-based lemmatization for quick lookup of an unknown word."
readme = "README.md"
requires-python = ">=3.13"
classifiers = [
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
"Homepage" = "https://github.com/Dittner/Dilemma"
"Bug Tracker" = "https://github.com/Dittner/Dilemma/issues"

[tool.hatch.build.targets.wheel]
packages = ["dilemma"]

[tool.hatch.build.targets.wheel.sources]
"dilemma" = "dilemma"
"data" = "dilemma/data"

[dependency-groups]
dev = [
    "hatch>=1.18.1",
    "mypy>=1.17.1",
    "pytest>=8.4.1",
    "ruff>=0.12.9",
] 
