[project]
name = "en_lemmatizer"
version = "0.1.0"
description = "English Dictionary"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.13.3",
    "pip>=26.0.1",
    "tabulate>=0.9.0",
]

[dependency-groups]
dev = [
    "mypy>=1.17.1",
    "pytest>=8.4.1",
    "ruff>=0.12.9",
]

[tool.pytest.ini_options]
pythonpath = "."
addopts = [
    "--import-mode=importlib",
]

[tool.uv.workspace]
members = [
    "en_lemmatizer",
]
