[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "Dilemma"
version = "0.1.3"
description = "A dictionary-based lemmatization for quick lookup of an unknown word."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.13.3",
    "pip>=26.0.1",
    "tabulate>=0.9.0",
]

[dependency-groups]
dev = [
    "mypy>=1.17.1",
    "pytest>=8.4.1",
    "ruff>=0.12.9",
]

[tool.pytest.ini_options]
pythonpath = "."
addopts = [
    "--import-mode=importlib",
]

[tool.hatch.build.targets.wheel]
packages = ["dilemma"]

[tool.hatch.build.targets.wheel.sources]
"dilemma" = "dilemma"
"data" = "dilemma/data"