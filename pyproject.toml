[project]
name = "Dilemma"
version = "0.1.3"
description = "A dictionary-based lemmatization for quick lookup of an unknown word."
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "Alexander Dittner", email = "alexander@dittner.com" }
]
dependencies = []

[dependency-groups]
dev = [
    "mypy>=1.17.1",
    "pytest>=8.4.1",
    "ruff>=0.12.9",
]

[tool.pytest.ini_options]
pythonpath = "."
addopts = [
    "--import-mode=importlib",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

